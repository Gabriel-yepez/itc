services:
  postgres:
    image: postgres:18-alpine
    container_name: fraude-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fraude}
      POSTGRES_USER: ${POSTGRES_USER:-fraude}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraude_dev}
      TZ: UTC
    ports:
      - "${POSTGRES_PUERTO:-5434}:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  datos_postgres:
